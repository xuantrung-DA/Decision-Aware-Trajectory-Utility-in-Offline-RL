[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datu-offline-rl"
version = "0.1.0"
description = "Decision-Aware Trajectory Utility research pipeline for Offline RL"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["offline reinforcement learning", "data valuation", "trajectory utility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "networkx>=3.0",
  "gymnasium>=1.0",
  "minari>=0.5",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "tensorboard>=2.15",
]

[project.optional-dependencies]
robotics = ["gymnasium-robotics>=1.3", "mujoco>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/xuantrung-DA/Decision-Aware-Trajectory-Utility-in-Offline-RL"
Issues = "https://github.com/xuantrung-DA/Decision-Aware-Trajectory-Utility-in-Offline-RL/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
